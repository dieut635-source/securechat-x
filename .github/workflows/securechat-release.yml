name: SecureChat Production Source Gate

# This workflow never receives the production signing key and never creates a distributable APK.
# It validates the exact source revision before the isolated/offline release ceremony.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Version in plugins/src/main/kotlin/Versions.kt (for example 26.08.3)'
        required: true
        type: string
      reason:
        description: 'Reason for running the production source gate'
        required: true
        type: string
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: securechat-production-source-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache -PallWarningsAsErrors=true

jobs:
  source-gate:
    name: Audit production source (no signing, no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Verify hydrated Git LFS objects
        run: |
          git lfs fsck
          bash tools/git/validate_lfs.sh

      # Full screenshot/unit-test suites need more memory than the default hosted runner provides.
      - name: Increase swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Validate source version and ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("plugins/src/main/kotlin/Versions.kt").read_text(encoding="utf-8")

          def value(name: str) -> int:
              match = re.search(rf"^private const val {name} = ([0-9]+)$", source, re.MULTILINE)
              if match is None:
                  raise SystemExit(f"Unable to read {name} from Versions.kt")
              return int(match.group(1))

          print(f"{value('versionYear')}.{value('versionMonth'):02d}.{value('versionReleaseNumber')}")
          PY
          )
          SOURCE_COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF_TYPE" = tag
              if [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match source version v$VERSION_NAME."
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
                echo "::error::Manual production gates must run from the default branch ($DEFAULT_BRANCH)."
                exit 1
              fi
              if [ "$EXPECTED_VERSION" != "$VERSION_NAME" ]; then
                echo "::error::Expected version $EXPECTED_VERSION does not match source version $VERSION_NAME."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          git merge-base --is-ancestor "$SOURCE_COMMIT" "origin/$DEFAULT_BRANCH" || {
            echo "::error::The selected commit is not contained in origin/$DEFAULT_BRANCH."
            exit 1
          }

          SHORT_COMMIT=$(printf '%s' "$SOURCE_COMMIT" | cut -c1-12)
          {
            echo "SECURECHAT_VERSION_NAME=$VERSION_NAME"
            echo "SECURECHAT_SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "SECURECHAT_SHORT_COMMIT=$SHORT_COMMIT"
          } >> "$GITHUB_ENV"

      - name: Check SecureChat configuration
        run: bash tools/check/check_securechat_configuration.sh

      - name: Require reviewed dependency checksums
        run: |
          test -f gradle/verification-metadata.xml || {
            echo "::error::Missing reviewed gradle/verification-metadata.xml; production remains blocked."
            exit 1
          }
          grep -Fq '<sha256 value=' gradle/verification-metadata.xml || {
            echo "::error::Dependency verification metadata contains no SHA-256 checksums."
            exit 1
          }

      - name: Use JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Full unit-test suite
        run: ./gradlew test $CI_GRADLE_ARG_PROPERTIES

      - name: Screenshot verification
        run: ./gradlew verifyPaparazziDebug $CI_GRADLE_ARG_PROPERTIES

      - name: Static quality gates
        run: ./gradlew detekt ktlintCheck $CI_GRADLE_ARG_PROPERTIES

      # NVD_API_KEY is required: Dependency-Check 13 fetches the CVE database through the NVD API,
      # which rejects unauthenticated callers. Without it this gate fails outright rather than
      # passing on an empty database - see the dependencyCheck block in build.gradle.kts.
      - name: Dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./gradlew
          :dependencyCheckAggregate
          --no-parallel
          --no-configure-on-demand
          $CI_GRADLE_ARG_PROPERTIES

      - name: Upload dependency vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securechat-production-dependency-check
          path: '**/build/reports/dependency-check-report.*'
          if-no-files-found: warn
          retention-days: 14

      - name: Lint release sources and verify embedded call assets
        run: >-
          ./gradlew
          :app:lintFdroidRelease
          :features:call:impl:verifySecureChatCallAssets
          $CI_GRADLE_ARG_PROPERTIES

      - name: Compile F-Droid release sources without signing
        run: ./gradlew :app:compileFdroidReleaseSources $CI_GRADLE_ARG_PROPERTIES

      - name: Assert that CI produced no release artifact
        run: |
          set -euo pipefail
          RELEASE_ARTIFACT=$(find app/build -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.apks' \) -print -quit 2>/dev/null || true)
          if [ -n "$RELEASE_ARTIFACT" ]; then
            echo "::error::Cloud CI unexpectedly produced a distributable release artifact: $RELEASE_ARTIFACT"
            exit 1
          fi

      - name: Record source-gate result
        env:
          RELEASE_REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### SecureChat production source gate passed"
            echo
            echo "- Version: \`$SECURECHAT_VERSION_NAME\`"
            echo "- Commit: \`$SECURECHAT_SOURCE_COMMIT\`"
            echo "- Reason: ${RELEASE_REASON:-tag-triggered gate}"
            echo "- Signing key exposed to GitHub: **no**"
            echo "- Distributable APK/AAB produced: **no**"
            echo
            echo "Build and sign only with \`tools/release/build_securechat_offline.sh\` on the isolated release workstation."
          } >> "$GITHUB_STEP_SUMMARY"
