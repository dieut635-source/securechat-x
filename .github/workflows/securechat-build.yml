name: SecureChat APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore: [ '**.md' ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache -PallWarningsAsErrors=false

jobs:
  build:
    name: Build debug APK (fdroid)
    runs-on: ubuntu-latest
    concurrency:
      group: securechat-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Element X là project lớn; runner mặc định dễ hết dung lượng đĩa.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # Bản fdroid dùng UnifiedPush nên KHÔNG cần google-services.json.
      # Khi có Firebase project cho com.securechat.app thì đổi sang assembleGplayDebug.
      - name: Assemble fdroid debug APK
        run: ./gradlew :app:assembleFdroidDebug $CI_GRADLE_ARG_PROPERTIES

      # arm64-v8a: ~99 MB thay vì ~197 MB của bản universal (bản debug chưa strip ký hiệu của
      # Rust SDK nên vẫn nặng). Mọi điện thoại Android đời mới (kể cả Samsung/Knox) đều là arm64.
      # Cần bản universal thì đổi lại tên file ở đây.
      # Bản split theo ABI đã được build sẵn nên lấy thêm x86_64 không tốn thêm thời gian.
      - name: Collect APKs
        run: |
          D=app/build/outputs/apk/fdroid/debug
          cp "$D/app-fdroid-arm64-v8a-debug.apk" app-debug.apk
          cp "$D/app-fdroid-x86_64-debug.apk"    app-debug-x86_64.apk

      # Hai artifact riêng để chỉ phải tải bản mình cần (~100 MB thay vì 200 MB).
      # Máy Android thật và emulator trên Mac Apple Silicon -> arm64. Emulator trên máy Intel -> x86_64.
      - name: Upload APK (arm64 — điện thoại thật, Mac Apple Silicon)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug.apk
          path: app-debug.apk
          if-no-files-found: error

      - name: Upload APK (x86_64 — emulator trên máy Intel)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-x86_64.apk
          path: app-debug-x86_64.apk
          if-no-files-found: error

  test:
    name: Unit tests (modules SecureChat sửa)
    runs-on: ubuntu-latest
    concurrency:
      group: securechat-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # Chỉ chạy test của những module ta đã sửa (homeserver mặc định, màu thương hiệu).
      # Toàn bộ test suite của upstream cần Git LFS + secrets nên không chạy ở đây.
      - name: Run unit tests
        run: >-
          ./gradlew
          :features:login:impl:testDebugUnitTest
          :features:enterprise:impl-foss:testDebugUnitTest
          :libraries:mdm:impl:testDebugUnitTest
          :features:messages:impl:testDebugUnitTest
          :features:share:impl:testDebugUnitTest
          $CI_GRADLE_ARG_PROPERTIES

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            features/login/impl/build/reports/tests/**
            features/enterprise/impl-foss/build/reports/tests/**
            libraries/mdm/impl/build/reports/tests/**
            features/messages/impl/build/reports/tests/**
            features/share/impl/build/reports/tests/**
