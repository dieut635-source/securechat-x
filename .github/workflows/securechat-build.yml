name: SecureChat APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache -PallWarningsAsErrors=false

jobs:
  build:
    name: Build debug APK (fdroid)
    runs-on: ubuntu-latest
    concurrency:
      group: securechat-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Element X là project lớn; runner mặc định dễ hết dung lượng đĩa.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # Bản fdroid dùng UnifiedPush nên KHÔNG cần google-services.json.
      # Khi có Firebase project cho com.securechat.app thì đổi sang assembleGplayDebug.
      - name: Assemble fdroid debug APK
        run: ./gradlew :app:assembleFdroidDebug $CI_GRADLE_ARG_PROPERTIES

      - name: Rename universal APK to app-debug.apk
        run: cp app/build/outputs/apk/fdroid/debug/app-fdroid-universal-debug.apk app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug.apk
          path: app-debug.apk
          if-no-files-found: error
