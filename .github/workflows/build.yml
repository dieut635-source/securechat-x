name: APK Build

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [ develop ]

permissions:
  contents: read

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [debug, release, nightly]
      fail-fast: false
    # Allow all jobs on develop. Just one per PR.
    concurrency:
      group: ${{ github.ref == 'refs/heads/develop' && format('build-develop-{0}-{1}', matrix.variant, github.sha) || format('build-{0}-{1}', matrix.variant, github.ref)  }}
      cancel-in-progress: true
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          # This might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: true
          # All of these default to true, but we should only need the 'android' one (and maybe swap-storage?)
          android: false
          dotnet: true
          haskell: true
          # This takes way too long to run (~2 minutes) and it saves only ~5.5GB
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ensure we are building the branch and not the branch after being merged on develop
          # https://github.com/actions/checkout/issues/881
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble debug APKs
        if: ${{ matrix.variant == 'debug' }}
        env:
          SECURECHAT_MAPTILER_API_KEY: ${{ secrets.SECURECHAT_MAPTILER_API_KEY }}
          SECURECHAT_MAPTILER_LIGHT_MAP_ID: ${{ secrets.SECURECHAT_MAPTILER_LIGHT_MAP_ID }}
          SECURECHAT_MAPTILER_DARK_MAP_ID: ${{ secrets.SECURECHAT_MAPTILER_DARK_MAP_ID }}
          SECURECHAT_CALL_SENTRY_DSN: ${{ secrets.SECURECHAT_CALL_SENTRY_DSN }}
          SECURECHAT_CALL_POSTHOG_API_HOST: ${{ secrets.SECURECHAT_CALL_POSTHOG_API_HOST }}
          SECURECHAT_CALL_POSTHOG_API_KEY: ${{ secrets.SECURECHAT_CALL_POSTHOG_API_KEY }}
          SECURECHAT_CALL_RAGESHAKE_URL: ${{ secrets.SECURECHAT_CALL_RAGESHAKE_URL }}
        run: ./gradlew :app:assembleFdroidDebug -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES
      - name: Upload debug APKs
        if: ${{ matrix.variant == 'debug' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securechat-debug
          path: |
            app/build/outputs/apk/fdroid/debug/*-universal-debug.apk
      # Cloud CI must never receive the production key or emit a production-looking APK/AAB.
      # Packaging is reserved for tools/release/build_securechat_offline.sh.
      - name: Compile release sources without packaging
        if: ${{ matrix.variant == 'release' }}
        run: ./gradlew :app:compileFdroidReleaseSources -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES
      - name: Assert that CI produced no release artifact
        if: ${{ matrix.variant == 'release' }}
        run: |
          RELEASE_ARTIFACT=$(find app/build -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.apks' \) -print -quit 2>/dev/null || true)
          if [ -n "$RELEASE_ARTIFACT" ]; then
            echo "::error::Cloud CI unexpectedly produced a release artifact: $RELEASE_ARTIFACT"
            exit 1
          fi
      - name: Compile nightly sources
        if: ${{ matrix.variant == 'nightly' }}
        run: ./gradlew compileFdroidNightlySources -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES
