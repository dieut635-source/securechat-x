name: Bug report for SecureChat Android
description: Report a SecureChat issue after checking this repository's open issues for duplicates.
labels: [T-Defect]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Please report security issues through GitHub's private vulnerability reporting instead of a public issue.
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Please attach screenshots, videos or logs if you can.
      placeholder: Tell us what you see!
      value: |
        1. Where are you starting? What can you see?
        2. What do you click?
        3. More steps…
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Outcome
      placeholder: Tell us what went wrong
      value: |
        #### What did you expect?

        #### What happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your phone model
      placeholder: e.g. Samsung S6
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: e.g. Android 10.0
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Application version and app store
      description: You can find the version information at the bottom of the Settings screen.
      placeholder: e.g. SecureChat version 1.2.3
    validations:
      required: false
  - type: input
    id: homeserver
    attributes:
      label: Homeserver
      description: |
        Which server is your account registered on? If it is a local or non-public homeserver, please tell us what is the homeserver implementation (ex: Synapse/Dendrite/etc.) and the version.
      placeholder: e.g. chat.securechat.com.au or Synapse 1.150.0
    validations:
      required: false
  - type: dropdown
    id: rageshake
    attributes:
      label: Will you send logs?
      description:  |
        Trigger the defect, then click on the menu from the room list then "Report a bug". Describe the issue, mentioning that you have also filed a bug (it's helpful if you can include a link to the bug). Send the report to submit anonymous logs to the developers.
      options:
        - 'No'
        - 'Yes'
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: Will you submit a Pull Request?
      description:  |
        Submitting a Pull Request can drastically speed up the process of fixing this bug. Don't worry, it's still OK to answer 'No' :).
      options:
        - 'No'
        - 'Yes'
    validations:
      required: true
