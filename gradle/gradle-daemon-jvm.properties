#
# JDK cho chính daemon Gradle.
#
# Dự án đã khai jvmToolchain 21 (Versions.kt), nhưng toolchain chỉ áp cho việc
# biên dịch. Bản thân daemon vẫn chạy trên JDK nào mà JAVA_HOME trỏ tới. Trên
# máy có JDK 26, detekt hỏng với thông báo chỉ vẻn vẹn là chuỗi phiên bản JVM:
#
#   A failure occurred while executing DetektWorkAction
#      > 26.0.2.1
#
# Nguyên nhân: Kotlin compiler nhúng trong detekt (2.0.21) không hiểu bytecode
# target đó. CI không gặp vì nó cài sẵn JDK 21.
#
# Ghim ở đây để máy phát triển chạy đúng phiên bản CI dùng, mà không phải đặt
# JAVA_HOME thủ công hay ghi đường dẫn riêng của từng máy vào repo.
#
toolchainVersion=21
